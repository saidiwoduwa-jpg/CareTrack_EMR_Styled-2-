{% extends 'base.html' %}{% block title %}Add medicine | CareTrack EMR{% endblock %}{% block content %}<div class="heading"><div><p class="eyebrow">PHARMACY</p><h1>Add medicine</h1><p class="muted">Add an inventory catalogue item.</p></div><a class="btn btn-light" href="{{ url_for('medicines') }}">Cancel</a></div><section class="panel form-panel"><form method="post" class="form two"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Medicine name *<input name="name" required maxlength="120"></label><label>Strength<input name="strength" maxlength="80" placeholder="e.g. 500 mg"></label><label>Form<input name="form" maxlength="80" placeholder="Tablet, syrup"></label><label>Initial quantity<input name="quantity" type="number" min="0" value="0" required></label><label>Reorder level<input name="reorder_level" type="number" min="0" value="10" required></label><div class="actions"><button class="btn">Save medicine</button><a class="btn btn-light" href="{{ url_for('medicines') }}">Cancel</a></div></form></section>{% endblock %}
